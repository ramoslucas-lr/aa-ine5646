<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lais Portela e Lucas Ramos">
    <title>Login — AA10</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>UFSC · Programação Web · AA10</h1>
    </header>

    <main>
        <section>
            <h2>Login</h2>
            <form id="form-login" novalidate>
                <label>E-mail
                    <input type="email" id="login-email" required autocomplete="email">
                </label>
                <label>Senha
                    <input type="password" id="login-senha" required autocomplete="current-password">
                </label>
                <button type="submit" id="btn-login">Entrar</button>
                <p id="msg-login" class="msg-erro"></p>
                <p>Não tem conta? <a href="index.html">Cadastrar</a></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por: <strong>Lais Portela</strong> e <strong>Lucas Ramos</strong> — AA10 / UFSC</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
