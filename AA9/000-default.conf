# =============================================================================
# /etc/apache2/sites-available/000-default.conf   (Versão WSS)
#
# VirtualHost na porta 80 (HTTP). Apenas redireciona todo o tráfego para HTTPS,
# já que a atividade DEVE ser servida sobre HTTPS.
# =============================================================================
<VirtualHost *:80>
    ServerAdmin webmaster@ramos.lucas.vms.ufsc.br
    ServerName aa.ramos.lucas.vms.ufsc.br
    ServerAlias www.aa.ramos.lucas.vms.ufsc.br
    DocumentRoot /var/www/html

    # Redireciona HTTP -> HTTPS (301)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
