# =============================================================================
# /etc/apache2/sites-available/default-ssl.conf   (Versão WSS - proxy do WebSocket)
#
# VirtualHost na porta 443 (HTTPS) com certificado AUTOASSINADO.
# Serve a página (index.html, css, js), executa os scripts .py via CGI e
# ENCAMINHA o WebSocket com TLS FIM A FIM: wss://host/wss (443, mesmo cert) ->
# wss://127.0.0.1:8082 (server.py). O cliente usa wss:// sem aceitar nada na
# 8082 (que fica só no localhost), e a perna interna também é cifrada.
#
# Módulos necessários:  sudo a2enmod ssl headers rewrite cgi proxy proxy_wstunnel
#
# >>> ALTERE "name_server.idUFSC.vms.ufsc.br" pelo nome do seu servidor <<<
# =============================================================================
<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin webmaster@idUFSC.vms.ufsc.br
        ServerName name_server.idUFSC.vms.ufsc.br
        ServerAlias www.name_server.idUFSC.vms.ufsc.br
        DocumentRoot /var/www/html

        <Directory "/var/www/html">
            Options +ExecCGI +FollowSymLinks
            DirectoryIndex index.html
            AddHandler cgi-script .py
            AllowOverride None
            Require all granted
        </Directory>

        # ---- Habilita SSL --------
        #
        # garanta que o www-data lê o cert/chave:
        # sudo chgrp www-data /etc/apache2/ssl/apache.crt /etc/apache2/ssl/apache.key
        # sudo chmod 640 /etc/apache2/ssl/apache.key
        # sudo chmod 644 /etc/apache2/ssl/apache.crt
        #
        SSLEngine on
        SSLCertificateFile    /etc/apache2/ssl/apache.crt
        SSLCertificateKeyFile /etc/apache2/ssl/apache.key

        <FilesMatch "\.(?:cgi|shtml|phtml|php|py)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
        <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
        </Directory>

        # ---- WebSocket via proxy, TLS FIM A FIM (mod_proxy_wstunnel) --------
        # O server.py faz TLS no 8082 (herda o cert pelos SetEnv abaixo) e o
        # Apache fala wss:// com ele. O backend é loopback com cert autoassinado,
        # por isso a verificação do peer é desligada (não há o que autenticar
        # dentro da própria máquina).
        SetEnv WS_WS_HOST  127.0.0.1
        SetEnv WS_SSL_CERT /etc/apache2/ssl/apache.crt
        SetEnv WS_SSL_KEY  /etc/apache2/ssl/apache.key
        SSLProxyEngine on
        SSLProxyVerify none
        SSLProxyCheckPeerName off
        SSLProxyCheckPeerCN off
        ProxyPreserveHost On
        ProxyPass        /wss  wss://127.0.0.1:8082/
        ProxyPassReverse /wss  wss://127.0.0.1:8082/
        # --------------------------------------------------------------------

        # NÃO forçar HSTS (evita travar o navegador em HTTPS durante os testes)
        Header always set Strict-Transport-Security "max-age=0"

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>

# Após criar o arquivo no server:
# sudo a2enmod ssl headers rewrite cgi proxy proxy_wstunnel
# sudo apache2ctl configtest
# sudo systemctl reload apache2
# sudo apache2ctl -S # agora deve mostrar *:80 (000-default) e *:443 (default-ssl)
# sudo systemctl restart apache2
