# =============================================================================
# /etc/apache2/sites-available/000-default.conf   (Versão WSS)
#
# VirtualHost na porta 80 (HTTP). Apenas redireciona todo o tráfego para HTTPS,
# já que a atividade DEVE ser servida sobre HTTPS.
#
# >>> ALTERE "name_server.idUFSC.vms.ufsc.br" pelo nome do seu servidor <<<
# =============================================================================
<VirtualHost *:80>
    ServerAdmin webmaster@idUFSC.vms.ufsc.br
    ServerName name_server.idUFSC.vms.ufsc.br
    ServerAlias www.name_server.idUFSC.vms.ufsc.br
    DocumentRoot /var/www/html

    # Redireciona HTTP -> HTTPS (301)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
